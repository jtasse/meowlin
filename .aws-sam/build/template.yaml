AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Meowlin - Serverless Cat ID Demo
Parameters:
  PrimaryStageName:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod
    Description: Primary API stage (also used by sam local start-api).
Conditions:
  IsPrimaryDev:
    Fn::Equals:
    - Ref: PrimaryStageName
    - dev
  IsPrimaryProd:
    Fn::Equals:
    - Ref: PrimaryStageName
    - prod
Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures:
    - arm64
Resources:
  MeowlinHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:
        Ref: PrimaryStageName
  MeowlinHttpApiDevStage:
    Condition: IsPrimaryProd
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: MeowlinHttpApi
      StageName: dev
      AutoDeploy: true
  MeowlinHttpApiProdStage:
    Condition: IsPrimaryDev
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: MeowlinHttpApi
      StageName: prod
      AutoDeploy: true
  RequestUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meowlin-request-upload-url
      Handler: src/node/request-upload-url/requestUploadUrl.handler
      CodeUri: RequestUploadUrlFunction
      Environment:
        Variables:
          NODE_OPTIONS: --v8-pool-size=1
          CLIPS_TABLE_NAME: MeowlinClips
          RAW_AUDIO_BUCKET_NAME:
            Ref: RawAudioBucket
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MeowlinClipsTable
      - S3WritePolicy:
          BucketName:
            Ref: RawAudioBucket
      - Statement:
        - Effect: Allow
          Action:
          - s3:PutObject
          - s3:PutObjectAcl
          Resource:
            Fn::Join:
            - ''
            - - 'arn:'
              - Ref: AWS::Partition
              - ':s3:::'
              - Ref: RawAudioBucket
              - /*
      Events:
        Uploads:
          Type: HttpApi
          Properties:
            Path: /uploads
            Method: POST
            ApiId:
              Ref: MeowlinHttpApi
    Metadata:
      SamResourceId: RequestUploadUrlFunction
  MeowlinClipsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: MeowlinClips
      PrimaryKey:
        Name: clipId
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
  RawAudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: jtj-meowlin-raw-audio
Outputs:
  MeowlinHttpApiUrl:
    Description: API Gateway HTTP API endpoint URL
    Value:
      Fn::GetAtt:
      - MeowlinHttpApi
      - ApiEndpoint
  MeowlinHttpApiDevUploadsUrl:
    Description: dev stage URL for uploads endpoint
    Value:
      Fn::Sub: ${MeowlinHttpApi.ApiEndpoint}/dev/uploads
  MeowlinHttpApiProdUploadsUrl:
    Description: prod stage URL for uploads endpoint
    Value:
      Fn::Sub: ${MeowlinHttpApi.ApiEndpoint}/prod/uploads
  RequestUploadUrlFunctionArn:
    Description: ARN of the RequestUploadUrl Lambda Function
    Value:
      Fn::GetAtt:
      - RequestUploadUrlFunction
      - Arn
  MeowlinClipsTableName:
    Description: DynamoDB Table Name for MeowlinClips
    Value:
      Ref: MeowlinClipsTable
  RawAudioBucketName:
    Description: S3 Bucket Name for Raw Audio Uploads
    Value:
      Ref: RawAudioBucket
