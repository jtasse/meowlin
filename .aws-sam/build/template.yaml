AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Meowlin - Serverless Cat ID Demo
Parameters:
  RawAudioBucketName:
    Type: String
    Default: jtj-meowlin-raw-audio
    Description: 'Globally unique S3 bucket name for raw uploads. Passed to the clip-processing
      queue policy SourceArn without depending on the bucket resource (avoids create
      ordering cycles).

      '
Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures:
    - arm64
Resources:
  MeowlinHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: dev
  MeowlinHttpApiProdStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: MeowlinHttpApi
      StageName: prod
      AutoDeploy: true
  RequestUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meowlin-request-upload-url
      Handler: src/node/request-upload-url/requestUploadUrl.handler
      CodeUri: RequestUploadUrlFunction
      Environment:
        Variables:
          NODE_OPTIONS: --v8-pool-size=1
          CLIPS_TABLE_NAME: MeowlinClips
          RAW_AUDIO_BUCKET_NAME:
            Ref: RawAudioBucket
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MeowlinClipsTable
      - S3WritePolicy:
          BucketName:
            Ref: RawAudioBucket
      - Statement:
        - Effect: Allow
          Action:
          - s3:PutObject
          - s3:PutObjectAcl
          Resource:
            Fn::Join:
            - ''
            - - 'arn:'
              - Ref: AWS::Partition
              - ':s3:::'
              - Ref: RawAudioBucket
              - /*
      Events:
        Uploads:
          Type: HttpApi
          Properties:
            Path: /uploads
            Method: POST
            ApiId:
              Ref: MeowlinHttpApi
    Metadata:
      SamResourceId: RequestUploadUrlFunction
  MeowlinProcessClipFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meowlin-process-clip
      Runtime: python3.12
      Handler: app.lambda_handler
      CodeUri: MeowlinProcessClipFunction
      Environment:
        Variables:
          CLIPS_TABLE_NAME: MeowlinClips
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: MeowlinClipsTable
      - Statement:
        - Effect: Allow
          Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:ChangeMessageVisibility
          Resource:
            Fn::GetAtt:
            - MeowlinClipProcessingQueue
            - Arn
      Events:
        ProcessClipQueue:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - MeowlinClipProcessingQueue
              - Arn
    Metadata:
      SamResourceId: MeowlinProcessClipFunction
  MeowlinClipProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: MeowlinClipProcessing
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 60
  MeowlinClipProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowRawAudioBucketNotifications
          Effect: Allow
          Principal:
            Service: s3.amazonaws.com
          Action:
          - sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - MeowlinClipProcessingQueue
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:s3:::${RawAudioBucketName}
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      Queues:
      - Ref: MeowlinClipProcessingQueue
  MeowlinClipsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: MeowlinClips
      PrimaryKey:
        Name: clipId
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
  RawAudioBucket:
    Type: AWS::S3::Bucket
    DependsOn:
    - MeowlinClipProcessingQueuePolicy
    Properties:
      BucketName:
        Ref: RawAudioBucketName
      NotificationConfiguration:
        QueueConfigurations:
        - Event: s3:ObjectCreated:*
          Queue:
            Fn::GetAtt:
            - MeowlinClipProcessingQueue
            - Arn
          Filter:
            S3Key:
              Rules:
              - Name: prefix
                Value: uploads/
              - Name: suffix
                Value: .mp3
Outputs:
  MeowlinHttpApiUrl:
    Description: API Gateway HTTP API endpoint URL
    Value:
      Fn::GetAtt:
      - MeowlinHttpApi
      - ApiEndpoint
  MeowlinHttpApiDevUploadsUrl:
    Description: dev stage URL for uploads endpoint
    Value:
      Fn::Sub: ${MeowlinHttpApi.ApiEndpoint}/dev/uploads
  MeowlinHttpApiProdUploadsUrl:
    Description: prod stage URL for uploads endpoint
    Value:
      Fn::Sub: ${MeowlinHttpApi.ApiEndpoint}/prod/uploads
  RequestUploadUrlFunctionArn:
    Description: ARN of the RequestUploadUrl Lambda Function
    Value:
      Fn::GetAtt:
      - RequestUploadUrlFunction
      - Arn
  MeowlinClipsTableName:
    Description: DynamoDB Table Name for MeowlinClips
    Value:
      Ref: MeowlinClipsTable
  RawAudioBucketName:
    Description: S3 Bucket Name for Raw Audio Uploads
    Value:
      Ref: RawAudioBucket
  ClipProcessingQueueUrl:
    Description: SQS queue URL for S3 upload processing events
    Value:
      Ref: MeowlinClipProcessingQueue
  ClipProcessingQueueArn:
    Description: SQS queue ARN for S3 upload processing events
    Value:
      Fn::GetAtt:
      - MeowlinClipProcessingQueue
      - Arn
