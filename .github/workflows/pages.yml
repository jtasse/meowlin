name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4
        id: pages

      - name: Require API base URL
        run: |
          if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
            echo "::error::Set repository variable NEXT_PUBLIC_API_BASE_URL to your API Gateway stage URL (e.g. https://xxx.execute-api.us-east-1.amazonaws.com/prod)."
            exit 1
          fi
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/front-end/package-lock.json

      - name: Install and build
        working-directory: src/front-end
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_PAGES_URL: https://${{ github.repository_owner }}.github.io${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_APP_ENV: production
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/front-end/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
