name: Deploy frontend to GitHub Pages

# Live GitHub Pages hosting is retired (video demo only). Keep this workflow for
# manual redeploy if you stand the API back up and re-enable Pages on the repo.
on:
  workflow_dispatch:

# checkout/configure-pages still run on Node 20 internally until their v5+ tags;
# this opts those action runtimes into Node 24 (unrelated to setup-node below).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Use the same environment as deploy so variables/secrets defined under
    # Settings → Environments → github-pages are visible to the build job.
    environment:
      name: github-pages
    env:
      # Repository or github-pages environment variable/secret (no trailing slash).
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5
        id: pages

      - name: Require API base URL
        run: |
          if [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
            echo "::error::Add NEXT_PUBLIC_API_BASE_URL (e.g. https://xxx.execute-api.us-east-1.amazonaws.com/prod) as a repository Actions variable/secret OR under Settings → Environments → github-pages."
            exit 1
          fi

      - name: Setup Node.js for Next.js build
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/front-end/package-lock.json

      - name: Install and build
        working-directory: src/front-end
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_PAGES_URL: https://${{ github.repository_owner }}.github.io${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_APP_ENV: production
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/front-end/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
