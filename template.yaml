AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Meowlin - Serverless Cat ID Demo

Parameters:
  PrimaryStageName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Primary API stage (also used by sam local start-api).
  RawAudioBucketName:
    Type: String
    Default: jtj-meowlin-raw-audio
    Description: >
      Globally unique S3 bucket name for raw uploads. Passed to the clip-processing queue
      policy SourceArn without depending on the bucket resource (avoids create ordering cycles).

Conditions:
  IsPrimaryDev: !Equals [!Ref PrimaryStageName, dev]
  IsPrimaryProd: !Equals [!Ref PrimaryStageName, prod]

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures:
      - arm64

Resources:
  MeowlinHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref PrimaryStageName

  MeowlinHttpApiDevStage:
    Condition: IsPrimaryProd
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref MeowlinHttpApi
      StageName: dev
      AutoDeploy: true

  MeowlinHttpApiProdStage:
    Condition: IsPrimaryDev
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref MeowlinHttpApi
      StageName: prod
      AutoDeploy: true

  RequestUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meowlin-request-upload-url
      Handler: src/node/request-upload-url/requestUploadUrl.handler
      CodeUri: .
      Environment:
        Variables:
          NODE_OPTIONS: "--v8-pool-size=1"
          # Use explicit table name so local SAM resolution doesn't pass logical ID.
          CLIPS_TABLE_NAME: MeowlinClips
          RAW_AUDIO_BUCKET_NAME: !Ref RawAudioBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MeowlinClipsTable
        - S3WritePolicy:
            BucketName: !Ref RawAudioBucket
        - Statement: # Policy for S3 presigning
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl # Required if you need to set ACLs, otherwise can be removed
              Resource: !Join
                - ""
                - - "arn:"
                  - !Ref "AWS::Partition"
                  - ":s3:::"
                  - !Ref RawAudioBucket
                  - "/*"
      Events:
        Uploads:
          Type: HttpApi
          Properties:
            Path: /uploads
            Method: POST
            ApiId: !Ref MeowlinHttpApi

  MeowlinClipProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: MeowlinClipProcessing
      MessageRetentionPeriod: 1209600 # 14 days
      VisibilityTimeout: 60

  MeowlinClipProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRawAudioBucketNotifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt MeowlinClipProcessingQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:s3:::${RawAudioBucketName}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Queues:
        - !Ref MeowlinClipProcessingQueue

  MeowlinClipsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: MeowlinClips
      PrimaryKey:
        Name: clipId
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  RawAudioBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - MeowlinClipProcessingQueuePolicy
    Properties:
      BucketName: !Ref RawAudioBucketName
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt MeowlinClipProcessingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
                  - Name: suffix
                    Value: .mp3

Outputs:
  MeowlinHttpApiUrl:
    Description: "API Gateway HTTP API endpoint URL"
    Value: !GetAtt MeowlinHttpApi.ApiEndpoint
  MeowlinHttpApiDevUploadsUrl:
    Description: "dev stage URL for uploads endpoint"
    Value: !Sub "${MeowlinHttpApi.ApiEndpoint}/dev/uploads"
  MeowlinHttpApiProdUploadsUrl:
    Description: "prod stage URL for uploads endpoint"
    Value: !Sub "${MeowlinHttpApi.ApiEndpoint}/prod/uploads"
  RequestUploadUrlFunctionArn:
    Description: "ARN of the RequestUploadUrl Lambda Function"
    Value: !GetAtt RequestUploadUrlFunction.Arn
  MeowlinClipsTableName:
    Description: "DynamoDB Table Name for MeowlinClips"
    Value: !Ref MeowlinClipsTable
  RawAudioBucketName:
    Description: "S3 Bucket Name for Raw Audio Uploads"
    Value: !Ref RawAudioBucket

  ClipProcessingQueueUrl:
    Description: "SQS queue URL for S3 upload processing events"
    Value: !Ref MeowlinClipProcessingQueue

  ClipProcessingQueueArn:
    Description: "SQS queue ARN for S3 upload processing events"
    Value: !GetAtt MeowlinClipProcessingQueue.Arn
