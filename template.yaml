AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Meowlin - Serverless Cat ID Demo

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: nodejs20.x # Using nodejs20.x as nodejs22.x might not be available in all regions yet
    Architectures:
      - x86_64

Resources:
  MeowlinHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod

  RequestUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meowlin-request-upload-url
      Handler: src/handlers/requestUploadUrl.handler
      CodeUri: .
      Environment:
        Variables:
          CLIPS_TABLE_NAME: !Ref MeowlinClipsTable
          RAW_AUDIO_BUCKET_NAME: !Ref RawAudioBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MeowlinClipsTable
        - S3WritePolicy:
            BucketName: !Ref RawAudioBucket
        - Statement: # Policy for S3 presigning
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl # Required if you need to set ACLs, otherwise can be removed
              Resource: !Join
                - ""
                - - "arn:"
                  - !Ref "AWS::Partition"
                  - ":s3:::"
                  - !Ref RawAudioBucket
                  - "/*"
      Events:
        Uploads:
          Type: HttpApi
          Properties:
            Path: /uploads
            Method: POST
            ApiId: !Ref MeowlinHttpApi

  MeowlinClipsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: MeowlinClips
      PrimaryKey:
        Name: clipId
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  RawAudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub meowlin-raw-audio-${AWS::AccountId}-${AWS::Region} # Unique bucket name

Outputs:
  MeowlinHttpApiUrl:
    Description: "API Gateway HTTP API endpoint URL"
    Value: !GetAtt MeowlinHttpApi.ApiEndpoint
  RequestUploadUrlFunctionArn:
    Description: "ARN of the RequestUploadUrl Lambda Function"
    Value: !GetAtt RequestUploadUrlFunction.Arn
  MeowlinClipsTableName:
    Description: "DynamoDB Table Name for MeowlinClips"
    Value: !Ref MeowlinClipsTable
  RawAudioBucketName:
    Description: "S3 Bucket Name for Raw Audio Uploads"
    Value: !Ref RawAudioBucket
