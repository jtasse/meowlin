AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Meowlin - Serverless Cat ID Demo

Parameters:
  RawAudioBucketName:
    Type: String
    Default: jtj-meowlin-raw-audio
    Description: >
      Globally unique S3 bucket name for raw uploads. Passed to the clip-processing queue
      policy SourceArn without depending on the bucket resource (avoids create ordering cycles).
  UploadObjectExpirationDays:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 90
    Description: Delete objects under uploads/ after this many days (applies to all uploads).
  MaxUploadSizeBytes:
    Type: Number
    Default: 10485760
    MinValue: 1
    MaxValue: 52428800
    Description: Maximum presigned upload size in bytes (default 10 MiB).
  ApiStageThrottleRateLimit:
    Type: Number
    Default: 50
    MinValue: 1
    Description: Steady-state stage throttle (requests per second) for all routes.
  ApiStageThrottleBurstLimit:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Burst stage throttle (concurrent requests) for all routes.
  ApiUploadThrottleRateLimit:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Steady-state throttle (requests per second) for POST /uploads.
  ApiUploadThrottleBurstLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Burst throttle (concurrent requests) for POST /uploads.
  WafUploadsRateLimitPerIp:
    Type: Number
    Default: 100
    MinValue: 100
    MaxValue: 20000000
    Description: >
      Per-IP cap on POST /uploads in a 5-minute window (AWS WAF minimum is 100).
  WafClipsRateLimitPerIp:
    Type: Number
    Default: 300
    MinValue: 100
    MaxValue: 20000000
    Description: >
      Per-IP cap on GET /clips/* in a 5-minute window (covers poll traffic; AWS WAF minimum is 100).
  AlarmNotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email for SNS alarm notifications and monthly budget alerts. Leave empty to
      create alarms without notifications (visible in CloudWatch only). Confirm the SNS
      subscription after deploy.
  AlarmApi5xxThreshold:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Alarm when prod API 5xx count exceeds this in one 5-minute period.
  AlarmApi4xxThreshold:
    Type: Number
    Default: 100
    MinValue: 1
    Description: Alarm when prod API 4xx count exceeds this in one 5-minute period.
  AlarmWafBlockedThreshold:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Alarm when WAF blocked requests exceed this in one 5-minute period.
  AlarmLambdaErrorsThreshold:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Alarm when a single Lambda function error count exceeds this in one 5-minute period.
  AlarmS3ObjectCountThreshold:
    Type: Number
    Default: 2000
    MinValue: 1
    Description: Alarm when S3 NumberOfObjects for the raw audio bucket exceeds this (daily metric).
  MonthlyBudgetLimitUsd:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Monthly account cost budget (USD); 80% actual-spend alert when AlarmNotificationEmail is set.
  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:3000,http://127.0.0.1:3000"
    Description: >
      Browser origins allowed for API Gateway, Lambda CORS headers, and S3 presigned PUT
      (e.g. add https://your-user.github.io for GitHub Pages).

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures:
      - arm64

Conditions:
  HasAlarmNotificationEmail: !Not [!Equals [!Ref AlarmNotificationEmail, ""]]

Resources:
  # SAM manages the single prod stage and its deployment.
  MeowlinApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: meowlin-api
      StageName: prod
      OpenApiVersion: "3.0.1"
      # OPTIONS preflight uses * so multiple deploy-time origins work; Lambdas echo an
      # allowed Origin on responses when it matches CorsAllowedOrigins.
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'OPTIONS,POST,GET'"
        AllowHeaders: "'Content-Type'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !Ref ApiStageThrottleRateLimit
          ThrottlingBurstLimit: !Ref ApiStageThrottleBurstLimit
        - ResourcePath: "/uploads"
          HttpMethod: "POST"
          ThrottlingRateLimit: !Ref ApiUploadThrottleRateLimit
          ThrottlingBurstLimit: !Ref ApiUploadThrottleBurstLimit

  MeowlinApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: meowlin-api-uploads-rate-limit
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: meowlin-api-web-acl
      Rules:
        - Name: RateLimitUploadsPerIp
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafUploadsRateLimitPerIp
              AggregateKeyType: IP
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /uploads
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: meowlin-uploads-rate-limit-per-ip
        - Name: RateLimitGetClipsPerIp
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafClipsRateLimitPerIp
              AggregateKeyType: IP
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /clips/
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        PositionalConstraint: EXACTLY
                        SearchString: GET
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: meowlin-clips-rate-limit-per-ip

  MeowlinApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${RestApiId}/stages/${StageName}
        - RestApiId: !Ref MeowlinApi
          StageName: prod
      WebACLArn: !GetAtt MeowlinApiWebAcl.Arn

  RequestUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meowlin-request-upload-url
      Handler: src/api/request-upload-url/requestUploadUrl.handler
      CodeUri: .
      Environment:
        Variables:
          NODE_OPTIONS: "--v8-pool-size=1"
          CLIPS_TABLE_NAME: MeowlinClips
          RAW_AUDIO_BUCKET_NAME: !Ref RawAudioBucket
          MAX_UPLOAD_BYTES: !Ref MaxUploadSizeBytes
          CORS_ALLOWED_ORIGINS: !Join [",", !Ref CorsAllowedOrigins]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MeowlinClipsTable
        - S3WritePolicy:
            BucketName: !Ref RawAudioBucket
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Join
                - ""
                - - "arn:"
                  - !Ref "AWS::Partition"
                  - ":s3:::"
                  - !Ref RawAudioBucket
                  - "/*"
      Events:
        Uploads:
          Type: Api
          Properties:
            Path: /uploads
            Method: POST
            RestApiId: !Ref MeowlinApi

  GetClipResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meowlin-get-clip-result
      Handler: src/api/get-clip-result/getClipResult.handler
      CodeUri: .
      Environment:
        Variables:
          CLIPS_TABLE_NAME: MeowlinClips
          CORS_ALLOWED_ORIGINS: !Join [",", !Ref CorsAllowedOrigins]
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MeowlinClipsTable
      Events:
        GetClipResult:
          Type: Api
          Properties:
            Path: /clips/{clipId}
            Method: GET
            RestApiId: !Ref MeowlinApi

  MeowlinProcessClipFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meowlin-process-clip
      Runtime: python3.12
      # Inherits arm64 from Globals — ensure Python dependencies are built for arm64,
      # or override with Architectures: [x86_64] if using pre-built x86 packages.
      Handler: processClip.lambda_handler
      CodeUri: src/api/process-clip
      Environment:
        Variables:
          CLIPS_TABLE_NAME: MeowlinClips
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MeowlinClipsTable
      Events:
        ProcessClipQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt MeowlinClipProcessingQueue.Arn

  MeowlinClipProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: MeowlinClipProcessing
      MessageRetentionPeriod: 1209600 # 14 days
      VisibilityTimeout: 60

  MeowlinClipProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRawAudioBucketNotifications
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt MeowlinClipProcessingQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:s3:::${RawAudioBucketName}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Queues:
        - !Ref MeowlinClipProcessingQueue

  MeowlinClipsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: MeowlinClips
      PrimaryKey:
        Name: clipId
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  RawAudioBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - MeowlinClipProcessingQueuePolicy
    Properties:
      BucketName: !Ref RawAudioBucketName
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: !Ref UploadObjectExpirationDays
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            Prefix: uploads/
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref CorsAllowedOrigins
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt MeowlinClipProcessingQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  MeowlinAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmNotificationEmail
    Properties:
      TopicName: meowlin-alarms

  MeowlinAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmNotificationEmail
    Properties:
      TopicArn: !Ref MeowlinAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmNotificationEmail

  MeowlinCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlarmNotificationEmail
    Properties:
      Budget:
        BudgetName: meowlin-monthly-cost
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimitUsd
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlarmNotificationEmail

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: meowlin-api-5xx
      AlarmDescription: API Gateway prod stage 5xx errors
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: meowlin-api
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmApi5xxThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationEmail
        - - !Ref MeowlinAlarmTopic
        - !Ref AWS::NoValue

  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: meowlin-api-4xx
      AlarmDescription: API Gateway prod stage 4xx errors (throttling, WAF, client errors)
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: meowlin-api
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmApi4xxThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationEmail
        - - !Ref MeowlinAlarmTopic
        - !Ref AWS::NoValue

  WafBlockedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: meowlin-waf-blocked
      AlarmDescription: WAF blocked requests on the API stage (rate limits)
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: meowlin-api-uploads-rate-limit
        - Name: Region
          Value: !Ref AWS::Region
        - Name: Rule
          Value: ALL
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmWafBlockedThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationEmail
        - - !Ref MeowlinAlarmTopic
        - !Ref AWS::NoValue

  RequestUploadUrlErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: meowlin-lambda-request-upload-url-errors
      AlarmDescription: Errors in meowlin-request-upload-url
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: meowlin-request-upload-url
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmLambdaErrorsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationEmail
        - - !Ref MeowlinAlarmTopic
        - !Ref AWS::NoValue

  GetClipResultErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: meowlin-lambda-get-clip-result-errors
      AlarmDescription: Errors in meowlin-get-clip-result
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: meowlin-get-clip-result
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmLambdaErrorsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationEmail
        - - !Ref MeowlinAlarmTopic
        - !Ref AWS::NoValue

  ProcessClipErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: meowlin-lambda-process-clip-errors
      AlarmDescription: Errors in meowlin-process-clip
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: meowlin-process-clip
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmLambdaErrorsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationEmail
        - - !Ref MeowlinAlarmTopic
        - !Ref AWS::NoValue

  RawAudioBucketObjectCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: meowlin-s3-raw-audio-object-count
      AlarmDescription: Raw audio bucket object count high (possible upload abuse)
      Namespace: AWS/S3
      MetricName: NumberOfObjects
      Dimensions:
        - Name: BucketName
          Value: !Ref RawAudioBucketName
        - Name: StorageType
          Value: AllStorageTypes
      Statistic: Maximum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref AlarmS3ObjectCountThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationEmail
        - - !Ref MeowlinAlarmTopic
        - !Ref AWS::NoValue

Outputs:
  MeowlinApiUrl:
    Description: "API Gateway REST API base URL"
    Value: !Sub "https://${MeowlinApi}.execute-api.${AWS::Region}.amazonaws.com"
  MeowlinApiProdUploadsUrl:
    Description: "prod stage URL for uploads endpoint"
    Value: !Sub "https://${MeowlinApi}.execute-api.${AWS::Region}.amazonaws.com/prod/uploads"
  RequestUploadUrlFunctionArn:
    Description: "ARN of the RequestUploadUrl Lambda Function"
    Value: !GetAtt RequestUploadUrlFunction.Arn
  MeowlinClipsTableName:
    Description: "DynamoDB Table Name for MeowlinClips"
    Value: !Ref MeowlinClipsTable
  RawAudioBucketName:
    Description: "S3 Bucket Name for Raw Audio Uploads"
    Value: !Ref RawAudioBucket
  ClipProcessingQueueUrl:
    Description: "SQS queue URL for S3 upload processing events"
    Value: !Ref MeowlinClipProcessingQueue
  ClipProcessingQueueArn:
    Description: "SQS queue ARN for S3 upload processing events"
    Value: !GetAtt MeowlinClipProcessingQueue.Arn
  MeowlinApiWebAclArn:
    Description: "Regional WAF Web ACL ARN for per-IP rate limiting on uploads and clip polling"
    Value: !GetAtt MeowlinApiWebAcl.Arn
  MeowlinAlarmTopicArn:
    Condition: HasAlarmNotificationEmail
    Description: "SNS topic for CloudWatch alarms (confirm email subscription after deploy)"
    Value: !Ref MeowlinAlarmTopic
