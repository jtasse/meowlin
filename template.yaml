AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Meowlin serverless demo application

Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Runtime: nodejs22.x

Resources:
  RequestUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: meowlin-request-upload-url
      CodeUri: src/request-upload-url/
      Handler: app.handler
      Events:
        RequestUploadUrl:
          Type: HttpApi
          Properties:
            Path: /uploads
            Method: POST

Outputs:
  MeowlinApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
